<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - CARSON</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="logo site-logo" onclick="window.location.href='index.html'"><span class="site-logo-text">CARSON</span></div>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="articles.html">文章</a>
        <a href="friends.html">朋友们</a>
        <a href="about.html">关于</a>
      </div>
      <div class="auth-actions" id="authActions">
        <a class="auth-link active" href="login.html">登录</a>
      </div>
    </div>
  </nav>

  <main class="container page-container">
    <section class="auth-card">
      <p class="page-kicker">Login</p>
      <h1>登录账号</h1>
      <p class="auth-card-desc">登录后可保留你的访问身份，后续可继续扩展评论、投稿等功能。</p>
      <form class="front-auth-form" id="frontLoginForm">
        <div class="form-group-public">
          <label for="loginUsername">用户名</label>
          <input id="loginUsername" type="text" autocomplete="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group-public">
          <label for="loginPassword">密码</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <button class="btn-primary auth-submit-btn" id="frontLoginBtn" type="submit">登录</button>
        <p class="front-auth-msg" id="frontLoginMsg"></p>
      </form>
      <p class="auth-switch-text">还没有账号？<a href="register.html">去注册</a></p>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
