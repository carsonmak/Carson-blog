<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARSON - 简洁优雅的博客系统</title>
  <meta name="description" content="一个采用微信设计风格的简洁博客系统">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="logo site-logo" onclick="window.location.href='index.html'"><span class="site-logo-text">CARSON</span></div>
      <div class="nav-links">
        <a href="index.html" class="active">首页</a>
        <a href="articles.html">文章</a>
        <a href="friends.html">朋友们</a>
        <a href="about.html">关于</a>
      </div>
      <div class="navbar-actions">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索文章..." autocomplete="off">
          <button class="search-btn" id="searchBtn" aria-label="搜索">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
        <div class="auth-actions" id="authActions">
          <a class="auth-link" href="login.html">登录</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- 分类筛选标签栏 -->
  <div class="category-bar">
    <div class="category-bar-inner" id="categoryBar">
      <!-- 分类标签由 JS 动态渲染 -->
    </div>
  </div>

  <!-- 主内容区 -->
  <main class="container has-category-bar" id="articles">
    <section class="announcement-section" id="announcementSection">
      <!-- 网站公告由 JS 动态渲染 -->
    </section>

    <div id="app" class="post-list" data-home-only="true">
      <!-- 文章列表由 JS 动态渲染 -->
    </div>
  </main>

  <!-- 主页留言区 -->
  <section class="container">
    <div class="comment-section" id="homeCommentSection" data-target-type="home">
      <!-- 主页留言由 JS 动态渲染 -->
    </div>
  </section>

  <!-- 底部 footer -->
  <footer class="footer">
  </footer>

  <!-- 手机端底部导航 -->
  <nav class="mobile-tabbar" aria-label="手机端底部导航">
    <a class="mobile-tabbar-item" href="index.html" data-tab="home">
      <span class="mobile-tabbar-icon">⌂</span>
      <span>主页</span>
    </a>
    <a class="mobile-tabbar-item" href="articles.html" data-tab="articles">
      <span class="mobile-tabbar-icon">☰</span>
      <span>文章</span>
    </a>
    <a class="mobile-tabbar-item" href="friends.html" data-tab="friends">
      <span class="mobile-tabbar-icon">♡</span>
      <span>朋友们</span>
    </a>
    <a class="mobile-tabbar-item" href="about.html" data-tab="about">
      <span class="mobile-tabbar-icon">○</span>
      <span>关于</span>
    </a>
  </nav>

  <script src="js/main.js"></script>
</body>
</html>
