<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - CARSON 管理后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.89 1.08 3.56 2.78 4.66L4 17l2.83-1.35c.84.21 1.74.33 2.67.33.27 0 .53-.01.79-.03C9.8 15.36 9.5 14.45 9.5 13.5c0-3.04 2.91-5.5 6.5-5.5.27 0 .53.02.79.04C16.02 5.44 13.05 4 9.5 4zM7 8.5a1 1 0 110 2 1 1 0 010-2zm5 0a1 1 0 110 2 1 1 0 010-2zm4 1C12.91 9.5 10 11.74 10 14.5c0 1.5.85 2.85 2.18 3.76L11 20.5l2.3-1.1c.7.18 1.45.28 2.2.28.1 0 .2 0 .3-.01.84.51 1.86.83 3 .83 3.59 0 6.5-2.46 6.5-5.5S22.59 9.5 19 9.5h-3zm-1.5 2a.75.75 0 110 1.5.75.75 0 010-1.5zm4 0a.75.75 0 110 1.5.75.75 0 010-1.5z"/></svg>
      </div>
      <h1>CARSON 管理后台</h1>
      <p>请登录以继续管理</p>
    </div>

    <form class="login-form" id="loginForm" autocomplete="off">
      <div class="form-group">
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </span>
          <input type="text" id="username" placeholder="请输入用户名" required>
        </div>
      </div>
      <div class="form-group">
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 11c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
          </span>
          <input type="password" id="password" placeholder="请输入密码" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>
    </form>

    <p class="login-tip" id="adminProtectedFooter" data-protected-footer="1"></p>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/admin.js"></script>
</body>
</html>
